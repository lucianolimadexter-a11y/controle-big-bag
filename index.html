<style>

body{margin:0;background:#fff;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--az);color:#fff;padding:11px 14px;font-weight:700;font-size:17px}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--az);z-index:6}

main{padding:12px;max-width:900px;margin:0 auto}

.mu{color:var(--mu);font-size:13px;line-height:1.45}

video{width:100%;max-height:240px;background:#15202f;border-radius:10px;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--az);color:#fff;text-align:left;padding:6px;font-weight:600}
td{padding:6px;border-bottom:1px solid var(--bd);vertical-align:top}
tr:nth-child(even) td{background:var(--zb)}

/* ---------- leitura ---------- */
let lastOk='',lastOkT=0;
function processCode(code){
  code=String(code||'').trim();if(!code)return false;
  const c=openCar();
  if(!c){flash(false);beep(false);aviso('warn','Abra um carregamento primeiro');return false}
  const d=achar(code);
  if(d){flash(false);beep(false);aviso('err','✖ REPETIDO: '+code,'Já saiu na ficha '+pad4(d.c.num)+' ('+fd2(d.c.ini)+' · placa '+(d.c.placa||'-')+')');return false}
  c.itens.push({num:code,ts:Date.now()});
  lastOk=code;lastOkT=Date.now();
  save();flash(true);beep(true);aviso('ok','✔ Lido: '+code,(c.produto?c.produto+' · ':'')+'lote '+c.lote);updLer();return true;
}
function updLer(){
  const c=openCar();
  const a=$('cnt'),l=$('lista');
  if(c&&a)a.innerHTML=c.itens.length+' <span>big bags · '+kgTxt(totalKg(c))+'</span>';
  if(c&&l)l.innerHTML=listaItens(c,true);
  hdr();
}
function listaItens(c,rev){
  if(!c.itens.length)return '<div class="mu">Nada lido ainda.</div>';
  const arr=c.itens.map((i,k)=>({i,n:k+1}));if(rev)arr.reverse();
  let h='<table><tr><th>#</th><th>Número</th><th>Hora</th></tr>';
  arr.forEach(x=>{h+='<tr><td>'+x.n+'</td><td><b>'+esc(x.i.num)+'</b></td><td>'+fdt(x.i.ts).slice(11,19)+'</td></tr>'});
  return h+'</table>';
}
function manual(){const e=$('man');const v=e.value.trim();e.value='';if(v)processCode(v);e.focus()}

/* ---------- câmera (com espera de 3 s após cada leitura válida) ---------- */
let stream=null,det=null,scanning=false,zx=null,lastCode='',lastT=0,camBlock=0;
function onCode(code){
  const now=Date.now();
  if(!code)return;
  if(now<camBlock)return;                           // espera de 3 s, em silêncio
  if(code===lastOk&&now-lastOkT<8000)return;        // mesmo item ainda na imagem: ignora em silêncio
  if(code===lastCode&&now-lastT<4000)return;
  lastCode=code;lastT=now;
  if(processCode(code))camBlock=Date.now()+3000;
}
async function startCam(){
  if(!openCar()){aviso('warn','Abra um carregamento primeiro');return}
  if(scanning)return;
  const v=$('vid');if(!v)return;
  try{
    let nativo=false;
    if('BarcodeDetector' in window){
      try{const f=await BarcodeDetector.getSupportedFormats();nativo=f.includes('code_128')}catch(e){nativo=false}
    }
    if(nativo){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
      v.srcObject=stream;await v.play();
      det=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','itf','upc_a','codabar','qr_code']});
      scanning=true;loopCam();
    }else{
      if(typeof ZXing==='undefined'){aviso('warn','Leitor não carregou','Verifique a internet ou digite o número.');return}
      zx=new ZXing.BrowserMultiFormatReader();
      scanning=true;
      zx.decodeFromConstraints({video:{facingMode:'environment'}},v,(r)=>{if(r)onCode(r.getText())});
    }
    const b=$('btnCam');if(b)b.textContent='Parar câmera';
  }catch(e){scanning=false;aviso('err','Câmera indisponível',e.message||e.name)}
}
async function loopCam(){
  if(!scanning||!det)return;
  const v=$('vid');
  try{if(v&&v.readyState>=2){const r=await det.detect(v);if(r.length)onCode(r[0].rawValue)}}catch(e){}
  setTimeout(loopCam,150);
}
function stopCam(){
  scanning=false;
  try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{if(zx)zx.reset()}catch(e){}
  stream=null;zx=null;det=null;
  const v=$('vid');if(v)v.srcObject=null;
  const b=$('btnCam');if(b)b.textContent='Ligar câmera';
}

async function pdfDeCanvas(cvs,pageW,nome){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const put=d=>{const u=typeof d==='string'?enc.encode(d):d;parts.push(u);len+=u.length};
  const N=cvs.length,jp=[];
  for(const cv of cvs){const jb=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.93));jp.push(new Uint8Array(await jb.arrayBuffer()))}
  put('%PDF-1.4\n');
  const obj=(id,f)=>{off[id]=len;put(id+' 0 obj\n');f();put('\nendobj\n')};
  obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>put('<< /Type /Pages /Count '+N+' /Kids ['+cvs.map((_,k)=>(3+k*3)+' 0 R').join(' ')+'] >>'));
  cvs.forEach((cv,k)=>{const p=3+k*3,H=(pageW*cv.height/cv.width).toFixed(1);
    obj(p,()=>put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pageW+' '+H+'] /Resources << /XObject << /I'+k+' '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>'));
    const cs='q '+pageW+' 0 0 '+H+' 0 0 cm /I'+k+' Do Q';
    obj(p+1,()=>put('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(p+2,()=>{put('<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jp[k].length+' >>\nstream\n');put(jp[k]);put('\nendstream')});
  });
  const tot=3+N*3,xr=len;let t='xref\n0 '+tot+'\n0000000000 65535 f \n';
  for(let i=1;i<tot;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  put(t+'trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new File(parts,nome,{type:'application/pdf'});
}

/* ---------- envio (WhatsApp / compartilhar) ---------- */
async function shareFiles(files,text){
  const cs=f=>{try{return !!(navigator.canShare&&navigator.canShare({files:f}))}catch(e){return false}};
  let nome='';
  let ok=cs(files)?files:files.filter(f=>cs([f]));
  const resto=files.filter(f=>!ok.includes(f));
  const tent=async()=>{try{await navigator.share({files:ok,title:'Controle Big Bag'});return 1}catch(e){if(e&&e.name==='AbortError')return 2;nome=(e&&e.name)||'erro';return 0}};
  if(ok.length){
    let r=await tent();
    if(r===0){
      const d=await dlg({title:'Enviar pelo WhatsApp',ok:'Compartilhar',okCls:'g',cancel:'Voltar',html:'<div class="mu">Arquivos prontos. Toque em <b>Compartilhar</b> e escolha o WhatsApp.</div>'});
      if(!d)return false;
      r=await tent();
    }
    if(r===2)return false;
    if(r===1){
      if(resto.length){resto.forEach((f,i)=>setTimeout(()=>download(f),i*600));aviso('info','Enviado','O Excel não vai direto neste navegador: foi salvo em Downloads. No WhatsApp: clipe → Documento.')}
      return !resto.length;
    }
  }
  /* sem compartilhar arquivos neste navegador: baixa e abre o WhatsApp com 1 toque */
  files.forEach((f,i)=>setTimeout(()=>download(f),i*600));
  const det='sem suporte: '+files.map(f=>f.type||f.name).join(', ')+(nome?' · erro '+nome:'')+' · '+(window.isSecureContext?'https/seguro':'endereço não seguro');
  const r2=await dlg({title:'Arquivos baixados',ok:'Abrir WhatsApp',okCls:'g',cancel:'Fechar',
    html:'<div class="mu">Este navegador/endereço não envia arquivos direto. Eles foram salvos em Downloads. Toque em <b>Abrir WhatsApp</b>, escolha a conversa e anexe (clipe → Documento).<br><br><small>Detalhe técnico: '+esc(det)+'</small></div>'});
  if(r2)location.href='https://wa.me/?text='+encodeURIComponent(text);
  return false;
}

   +'<button class="b r" onclick="finalizarCar()">Finalizar carregamento</button></div>'
   +'<div class="card"><video id="vid" playsinline muted></video>'
   +'<label style="margin-top:8px">Digitar ou usar leitor externo</label>'
   +'<div class="row"><input id="man" inputmode="numeric" placeholder="Número do código de barras" autocomplete="off" style="flex:3"><button class="b" style="flex:1" onclick="manual()">OK</button></div></div>'
   +'<div class="card"><h3>Lidos neste carregamento</h3><div id="lista"></div></div>';
  return h;
}
function fichaCard(c){
  const aberto=openId===c.id?' open':'';
  return '<details class="fc" id="f'+c.id+'"'+aberto+' ontoggle="if(this.open)prepShare('+c.id+').catch(()=>0)"><summary>Ficha '+pad4(c.num)+' · '+esc(rotulo(c))+(c.fim?'':' <span class="tag w">aberta</span>')+'</summary>'
   +'<div class="mu" style="margin:6px 0">Placa <b>'+esc(c.placa||'—')+'</b>'+(c.motorista?' · '+esc(c.motorista):'')+' · Lote '+esc(c.lote||'—')+'<br>'+fh(c.ini)+(c.fim?' → '+fh(c.fim):'')+' · '+c.itens.length+' big bags · '+kgTxt(totalKg(c))+(pesoNum(c.peso)>0?' ('+kg(pesoNum(c.peso))+' kg cada)':'')+(c.corrigida?'<br><span class="tag w">cabeçalho corrigido em '+fd(c.corrigida)+'</span>':'')+'</div>'
   +listaItens(c,false)
   +'<div style="margin-top:6px"><button class="b g" onclick="whatsCar('+c.id+')">WhatsApp</button><button class="b" onclick="xlsCar('+c.id+')">Excel</button><button class="b s" onclick="pdfCar('+c.id+')">PDF</button><button class="b s" onclick="pngCar('+c.id+')">Imagem</button><button class="b s" onclick="imprimirFicha('+c.id+')">Imprimir / PDF</button><button class="b s" onclick="editarCab('+c.id+')">'+(c.fim?'Corrigir cabeçalho':'Editar cabeçalho')+'</button>'+(c.fim&&isPC()?'<button class="b r" onclick="cancelarFicha('+c.id+')">Cancelar ficha</button>':'')+'</div></details>';
}
function vFic(){
  if(!S.car.length)return '<div class="card mu">Nenhuma ficha ainda. Abra um carregamento na aba Ler.</div>';
  let cars=S.car.slice();
  if(flt){const f=flt.toLowerCase();cars=cars.filter(c=>(c.placa+' '+c.motorista+' '+c.w3p+' '+c.produto+' '+c.lote+' '+fd(c.ini)+' '+pad4(c.num)+' '+c.itens.map(i=>i.num).join(' ')).toLowerCase().includes(f))}
  let h='<div class="card"><h3>Fichas de embarque</h3><div class="mu">Fichas fechadas ficam travadas: só consulta.</div><input id="flt" placeholder="Buscar por placa, W3P, lote, data, número..." value="'+esc(flt)+'" oninput="setFlt(this.value)"></div>';
  if(!cars.length)return h+'<div class="card mu">Nada encontrado.</div>';
  const m={};cars.forEach(c=>{(m[dkey(c.ini)]=m[dkey(c.ini)]||[]).push(c)});
  Object.keys(m).sort().reverse().forEach(k=>{
    const lst=m[k].sort((a,b)=>b.ini-a.ini);
    const tq=lst.reduce((s,c)=>s+c.itens.length,0);
    h+='<h4>'+fd(lst[0].ini)+' <span>· '+lst.length+' embarque'+(lst.length>1?'s':'')+' · '+tq+' big bags</span></h4>';
    lst.forEach(c=>{h+=fichaCard(c)});
  });
  return h;
}
function setFlt(v){flt=v;render(true,'flt')}
function filtrar(rows){
  if(fltB){const f=fltB.toLowerCase();rows=rows.filter(r=>(r.num+' '+r.w3p+' '+r.produto+' '+r.lote+' '+r.placa).toLowerCase().includes(f))}
  if(dDe){const t=new Date(dDe+'T00:00:00').getTime();rows=rows.filter(r=>r.ts>=t)}
  if(dAte){const t=new Date(dAte+'T23:59:59').getTime();rows=rows.filter(r=>r.ts<=t)}
  return rows;
}
function vBan(){
  const rows=filtrar(ctlRows());
  const pt=rows.reduce((s,r)=>s+pesoNum(r.peso),0);
  let h='<div class="card"><h3>Banco de saída</h3><div class="big">'+rows.length+' <span>big bags saíram · '+kgTxt(pt)+'</span></div>'
   +'<input id="flt" placeholder="Buscar número, W3P, lote, placa..." value="'+esc(fltB)+'" oninput="setFltB(this.value)">'
   +'<div class="row"><div><label>De</label><input type="date" id="dde" value="'+esc(dDe)+'" onchange="setD()"></div><div><label>Até</label><input type="date" id="date" value="'+esc(dAte)+'" onchange="setD()"></div></div>'
   +'<div style="margin-top:6px"><button class="b g" onclick="whatsGeral()">WhatsApp (PDF)</button><button class="b s" onclick="pdfBanco()">PDF</button><button class="b" onclick="xlsBanco()">Excel (.xlsx)</button>'
   +'<button class="b s" onclick="download(mkFile(\'banco-\'+stamp()+\'.txt\',txtCtl(filtrar(ctlRows()))))">TXT</button>'
   +(isPC()?'<button class="b r" onclick="apagarCtl()">Apagar estoque</button>':'')+'</div>'+(isPC()?'':'<div class="mu" style="margin-top:6px">Cancelar fichas e apagar estoque ficam no computador.</div>')+'</div>';
  if(!rows.length)return h+'<div class="card mu">Nada no banco. Ele é alimentado quando você finaliza um carregamento.</div>';
  grupos(rows).forEach(g=>{
    h+='<div class="dia"><div><b style="color:var(--az)">'+esc(g.w3p)+'</b> · '+esc(g.produto)+' <span class="tag">'+g.itens.length+' un</span>'+(g.kg>0?'<span class="tag">'+kg(g.kg)+' kg</span>':'')+'</div>'
     +'<table style="margin-top:6px"><tr><th>Número</th><th>Lote</th><th>Data</th><th>Placa</th><th>Ficha</th></tr>';
    g.itens.forEach(r=>{h+='<tr class="cl" onclick="abrirFicha('+r.carId+')"><td><b>'+esc(r.num)+'</b></td><td>'+esc(r.lote||'-')+'</td><td>'+fd2(r.ts)+' '+fh(r.ts)+'</td><td>'+esc(r.placa||'-')+'</td><td><a class="ln">'+pad4(r.ficha)+'</a></td></tr>'});
    h+='</table></div>';
  });
  return h;
}
function setFltB(v){fltB=v;render(true,'flt')}
function setD(){dDe=$('dde').value;dAte=$('date').value;render()}
function abrirFicha(id){openId=id;flt='';tab='fic';render();const e=$('f'+id);if(e&&e.scrollIntoView)e.scrollIntoView()}
async function apagarCtl(){
  if(!S.ctl.length){aviso('warn','O banco já está vazio');return}
  if(!S.senhaOk)await primeiraSenha();
  if(!S.senhaOk)return;
  const n=S.ctl.length;
  const r=await dlg({title:'Apagar todo o estoque',titleColor:'#D93636',ok:'Apagar estoque',okCls:'r',focus:'dSenha',
    html:'<div class="mu" style="margin-bottom:6px">Isso apaga os <b>'+n+' itens do Banco</b>. As fichas de embarque continuam guardadas.</div>'
      +'<label>Senha</label><input id="dSenha" type="password" autocomplete="off"><label>Digite <b style="color:#1B2430">APAGAR</b> para confirmar</label><input id="dPal" autocomplete="off" autocapitalize="characters">',
    collect:()=>({s:$('dSenha').value,p:$('dPal').value.trim().toUpperCase()}),
    validate:v=>!pwOk(v.s)?'Senha incorreta.':v.p!=='APAGAR'?'Digite a palavra APAGAR.':''});
  if(!r)return;
  S.ctl=[];S.wipe=true;save();render();aviso('ok','Estoque apagado','As fichas continuam guardadas.');
}

async function pedirSenhaPal(title,msg,ok,palavra){
  if(!S.senhaOk)await primeiraSenha();
  if(!S.senhaOk)return null;
  return dlg({title:title,titleColor:'#D93636',ok:ok,okCls:'r',focus:'dSenha',
    html:'<div class="mu" style="margin-bottom:6px">'+msg+'</div><label>Senha</label><input id="dSenha" type="password" autocomplete="off"><label>Digite <b style="color:#1B2430">'+palavra+'</b> para confirmar</label><input id="dPal" autocomplete="off" autocapitalize="characters">',
    collect:()=>({s:$('dSenha').value,p:$('dPal').value.trim().toUpperCase()}),
    validate:v=>!pwOk(v.s)?'Senha incorreta.':v.p!==palavra?'Digite a palavra '+palavra+'.':''});
}
function limpaSeq(){if(!S.car.length)S.seq=0}
async function cancelarFicha(id){
  const c=carOf(id);if(!c)return;
  const r=await pedirSenhaPal('Cancelar ficha '+pad4(c.num),'Isso <b>apaga a ficha '+pad4(c.num)+'</b> ('+esc(c.w3p||'-')+' · placa '+esc(c.placa||'-')+') e remove os <b>'+c.itens.length+' big bags</b> dela do Banco. Os números poderão ser lidos de novo. Não dá para desfazer.','Cancelar ficha','CANCELAR');
  if(!r)return;
  const nums=new Set(c.itens.map(i=>i.num));
  S.ctl=S.ctl.filter(x=>x.carId!==c.id&&!nums.has(x.num));
  if(!c.fim)stopCam();
  S.car=S.car.filter(x=>x!==c);S.delq.push(c.id);limpaSeq();
  if(openId===id)openId=null;
  save();render();aviso('ok','Ficha '+pad4(c.num)+' cancelada','Itens removidos do Banco.');
}
function vOnline(){
  let h='<div class="card"><h3>Online (outro aparelho)</h3>';
  if(!sbOn()){
    return h+'<div class="mu" style="margin-bottom:6px">Ainda não conectado. Cole o endereço e a chave pública do seu projeto no Supabase (o passo a passo está no arquivo de instruções).</div><label>Endereço (https://xxxx.supabase.co)</label><input id="sbUrl" autocapitalize="off" autocomplete="off"><label>Chave pública (anon)</label><input id="sbKey" autocapitalize="off" autocomplete="off"><button class="b g" onclick="salvaSB()">Salvar e entrar</button></div>';
  }
  const st=SY.st==='ok'?'Sincronizado'+(SY.t?' às '+fh(SY.t):''):SY.st==='nologin'?'Sem login neste aparelho':SY.st==='offline'?'Sem sinal: as fichas esperam na fila':SY.st==='err'?'Erro: '+esc(SY.msg||''):'Aguardando';
  const n=pendentes();
  h+='<div class="mu" style="margin-bottom:6px">'+st+(n?' · '+n+' item(ns) na fila':'')+(SESS?'<br>Conta: '+esc(SESS.email||''):'')+'</div>';
  h+=SESS?'<button class="b" onclick="syncNow()">Sincronizar agora</button><button class="b s" onclick="sairOnline()">Sair</button>':'<button class="b g" onclick="loginDlg()">Entrar</button>';
  return h+'</div>';
}
function vCfg(){
  let h='<div class="card"><h3>Cadastrar produto novo</h3><div class="mu" style="margin-bottom:6px">A lista da fábrica ('+S.produtos.length+' produtos) já está no app e aparece na busca ao abrir o carregamento. Use aqui só para incluir um W3P novo.</div>'
   +'<div class="row"><input id="pW3p" placeholder="W3P" autocapitalize="characters"><input id="pNome" placeholder="Produto"><input id="pPeso" placeholder="Peso (kg)" inputmode="decimal"></div>'
   +'<button class="b g" onclick="addProd()">Adicionar produto</button>';
  h+='</div>'+vOnline()+'<div class="card"><h3>Senha do estoque</h3><div class="mu" style="margin-bottom:6px">'+(S.senhaOk?'Sua senha está definida.':'Você ainda não criou uma senha.')+'</div><button class="b s" onclick="trocaSenha()">'+(S.senhaOk?'Trocar senha':'Criar senha')+'</button></div>'
   
   +'<div class="card"><h3>Backup (para restaurar no app)</h3><div class="mu" style="margin-bottom:6px">Salva tudo (produtos, fichas e banco) em um arquivo que <b>só este app consegue ler</b>. Serve para levar os dados a outro aparelho ou recuperar depois. Para ler os dados, use o Excel ou a imagem da ficha.</div>'
   +'<button class="b" onclick="bkExport()">Exportar backup</button><button class="b s" onclick="$(\'bkf\').click()">Restaurar backup</button><input type="file" id="bkf" accept=".json" style="display:none" onchange="bkImport(this)"></div>';
  return h;
}
function addProd(){
  const w=$('pW3p').value.trim().toUpperCase(),n=$('pNome').value.trim().toUpperCase(),p=$('pPeso').value.trim();
  if(!w||!n){aviso('warn','Informe W3P e produto');return}
  const i=S.produtos.findIndex(x=>x.w3p===w);
  if(i>=0)S.produtos[i]={w3p:w,nome:n,peso:p};else S.produtos.push({w3p:w,nome:n,peso:p});
  S.produtos.sort((a,b)=>a.w3p.localeCompare(b.w3p));save();render();aviso('ok','Produto salvo');
}
async function edProd(i){
  const p=S.produtos[i];if(!p)return;
  const r=await dlg({title:'Editar produto',ok:'Salvar',focus:'eW',
    html:'<label>W3P</label><input id="eW" value="'+esc(p.w3p)+'" autocapitalize="characters"><label>Produto</label><input id="eN" value="'+esc(p.nome)+'"><label>Peso padrão (kg)</label><input id="eP" value="'+esc(p.peso||'')+'" inputmode="decimal">',
    collect:()=>({w3p:$('eW').value.trim().toUpperCase(),nome:$('eN').value.trim().toUpperCase(),peso:$('eP').value.trim()}),
    validate:v=>!v.w3p||!v.nome?'Informe W3P e produto.':''});
  if(r){S.produtos[i]=r;save();render()}
}
async function delProd(i){
  const p=S.produtos[i];if(!p)return;
  const r=await dlg({title:'Remover produto?',ok:'Remover',okCls:'r',cancel:'Voltar',html:'<div class="mu">'+esc(p.w3p)+' · '+esc(p.nome)+'<br>As fichas já feitas não mudam.</div>'});
  if(r){S.produtos.splice(i,1);save();render()}
}
function bkExport(){download(new File([JSON.stringify(S)],'backup-controle-big-bag-'+stamp()+'.json',{type:'application/json'}));aviso('ok','Backup salvo','Guarde o arquivo para restaurar depois.')}
function bkImport(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);if(!d.car||!d.ctl)throw 0;
      const ok=await dlg({title:'Restaurar backup?',ok:'Restaurar',okCls:'r',cancel:'Voltar',html:'<div class="mu">Isso <b>substitui todos os dados</b> deste aparelho pelos do arquivo:<br>'+d.car.length+' fichas · '+d.ctl.length+' itens no banco.</div>'});
      if(!ok)return;
      S=migrate(d);save();render();aviso('ok','Backup restaurado');
    }catch(e){aviso('err','Arquivo inválido')}
  };
  r.readAsText(f);inp.value='';
}

function hdr(){
  const c=openCar();
  $('sub').textContent=(c?'Aberto: ficha '+pad4(c.num)+' · '+(c.placa||'-')+' · '+c.itens.length+' leituras':'Sem carregamento aberto')+' · Banco: '+S.ctl.length+nuvem();
}
function nuvem(){
  if(!sbOn())return '';
  const n=pendentes();
  if(SY.st==='ok')return n?' · ☁ enviando ('+n+')':' · ☁ sincronizado';
  if(SY.st==='nologin')return ' · ☁ sem login';
  if(SY.st==='offline')return ' · ☁ sem sinal'+(n?' ('+n+' na fila)':'');
  if(SY.st==='err')return ' · ☁ erro'+(n?' ('+n+' na fila)':'');
  return n?' · ☁ '+n+' na fila':'';
}
function render(keepFocus,focusId){
  const m=$('main');
  if(tab!=='ler')stopCam();
  m.innerHTML=tab==='ler'?vLer():tab==='fic'?vFic():tab==='ban'?vBan():vCfg();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  hdr();
  if(tab==='ler'){
    updLer();
    const man=$('man');if(man)man.addEventListener('keydown',e=>{if(e.key==='Enter')manual()});
    if(scanning&&stream){const v=$('vid');if(v){v.srcObject=stream;v.play().catch(()=>{})}}
  }
  if(keepFocus&&focusId){const e=$(focusId);if(e){e.focus();const l=e.value.length;try{e.setSelectionRange(l,l)}catch(x){}}}
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab!=='fic')openId=null;render()});
render();
(async function boot(){
  if(sbOn()){
    if(!SESS&&navigator.onLine)await loginDlg();
    if(SESS)await syncNow();
  }
  if(!S.senhaOk)setTimeout(primeiraSenha,300);
})();
</script>
</body>
</html>
